name: Restore exact CellularHub v1 source

on:
  push:
    branches:
      - import-v1.0.0

permissions:
  contents: write

jobs:
  restore:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout import branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate and rebuild correction archive
        shell: bash
        run: |
          set -euo pipefail

          for n in 00 01 02 03 04 05 07 08 09 10 11; do
            test "$(wc -c < ".transfer/corrxz${n}")" -eq 9000
          done
          test "$(wc -c < .transfer/corrxz06)" -ge 9000
          test "$(wc -c < .transfer/corrxz12a)" -eq 6000
          test "$(wc -c < .transfer/corrxz12b)" -eq 3000
          test "$(wc -c < .transfer/corrxz13a)" -eq 6000
          test "$(wc -c < .transfer/corrxz13b)" -eq 3000
          test "$(wc -c < .transfer/corrxz14)" -eq 4060

          out=/tmp/correction.tar.xz.b64
          : > "$out"
          for n in 00 01 02 03 04 05; do cat ".transfer/corrxz${n}" >> "$out"; done
          head -c 9000 .transfer/corrxz06 >> "$out"
          for n in 07 08 09 10 11; do cat ".transfer/corrxz${n}" >> "$out"; done
          cat .transfer/corrxz12a .transfer/corrxz12b >> "$out"
          cat .transfer/corrxz13a .transfer/corrxz13b >> "$out"
          cat .transfer/corrxz14 >> "$out"

          test "$(wc -c < "$out")" -eq 130060
          base64 -d "$out" > /tmp/correction.tar.xz
          echo 'da7d8e024f7b79c59822d5f561e5abca193218554ddfde1c39c9ecd3f575af36  /tmp/correction.tar.xz' | sha256sum -c -

      - name: Restore canonical files
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/correction.tar.xz -C .
          rm -rf .transfer

      - name: Commit canonical v1 source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: restore exact CellularHub 1.0.0 source'
          git push origin HEAD:import-v1.0.0
