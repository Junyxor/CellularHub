name: Finalize exact CellularHub v1 source

on:
  push:
    branches:
      - import-v1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download canonical v1 source zip
        shell: bash
        run: |
          set -euo pipefail
          url='https://drive.usercontent.google.com/download?id=1zusRWL2BfWWzwLOujIujs4OQ3zQwRbMy&export=download&confirm=t'
          curl --fail --location --retry 2 --output /tmp/cellularhub-v1.zip "$url"
          echo 'bedec8486db5a60ae2e201c8ad9b18706c59a71c297f211c8a8c9c38093c6bad  /tmp/cellularhub-v1.zip' | sha256sum -c -

      - name: Restore exact source tree
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cellularhub-v1
          mkdir -p /tmp/cellularhub-v1
          unzip -q /tmp/cellularhub-v1.zip -d /tmp/cellularhub-v1
          test -f /tmp/cellularhub-v1/CellularHub/package.json
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/cellularhub-v1/CellularHub/. .

      - name: Commit canonical source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: finalize CellularHub 1.0.0 source'
          git push origin HEAD:import-v1.0.0
