[package]
name = "cellularhub"
version = "1.0.0"
description = "Unified Windows cellular and SMS compatibility layer"
authors = ["CellularHub contributors"]
edition = "2021"

[lib]
name = "cellularhub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-clipboard-manager = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.10", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
window-vibrancy = "0.8.0"
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_MobileBroadband",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Foundation",
  "Data_Xml_Dom",
  "UI_Notifications"
] }
